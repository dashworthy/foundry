<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0EA5E9" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1E293B" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="#0B1120" />
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.5" />
  <rect width="1200" height="400" fill="url(#glow)" />

  <text
    x="72" y="255"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="100" font-weight="800" letter-spacing="-0.04em"
    fill="url(#accent)">Foundry</text>

  <text
    x="76" y="296"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="22" font-weight="400"
    fill="#94A3B8">Actions and Queries with reusable Preconditions for Laravel</text>

  <text
    x="1180" y="344"
    text-anchor="end"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="9" font-weight="800" font-style="italic" letter-spacing="0.02em"
    fill="#94A3B8">CRAFTED BY</text>

  <text
    x="1180" y="362"
    text-anchor="end"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="20" font-weight="900" font-style="italic" letter-spacing="-0.07em">
    <tspan fill="#F1F5F9">DASH</tspan><tspan fill="#CBD5E1">WORTHY</tspan>
  </text>
